name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: all features
            flags: ""
          - name: minimal parser
            flags: >-
              -DTELEBOT_FEATURE_PAYMENTS=0 -DTELEBOT_FEATURE_PASSPORT=0 -DTELEBOT_FEATURE_BUSINESS=0
              -DTELEBOT_FEATURE_GIFTS=0 -DTELEBOT_FEATURE_CHAT_EXTRAS=0 -DTELEBOT_FEATURE_WIDGETS=0
          - name: sanitizers, no block cache
            flags: >-
              -fsanitize=address,undefined -fno-omit-frame-pointer -DTELEBOT_ARENA_CACHE_BLOCKS=0
    name: ${{ matrix.name }}

    steps:
    - uses: actions/checkout@v3
    - name: prepare
      run: sudo apt update && sudo apt install -y pkg-config libcurl4-openssl-dev cmake binutils make g++
    - name: cmake
      run: >-
        cmake -S . -B build
        -DCMAKE_C_FLAGS="${{ matrix.flags }}"
        -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
        -DCMAKE_EXE_LINKER_FLAGS="${{ contains(matrix.flags, 'sanitize') && '-fsanitize=address,undefined' || '' }}"
    - name: make
      run: cmake --build build -j
    - name: unit tests
      run: cd build && ctest --output-on-failure

  docs:
    runs-on: ubuntu-latest
    name: API docs
    env:
      # same pinned release as .github/workflows/docs.yml, which publishes the site
      DOXYGEN_VERSION: 1.18.0
      DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
    steps:
    - uses: actions/checkout@v3
    - name: install doxygen
      run: |
        curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
          "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        echo "$DOXYGEN_SHA256  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
    - name: doxygen (any warning fails the build)
      run: ( cat Doxyconf; echo "WARN_AS_ERROR=FAIL_ON_WARNINGS" ) | doxygen -
