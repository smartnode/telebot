name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: all features
            flags: ""
          - name: minimal parser
            flags: >-
              -DTELEBOT_FEATURE_PAYMENTS=0 -DTELEBOT_FEATURE_PASSPORT=0 -DTELEBOT_FEATURE_BUSINESS=0
              -DTELEBOT_FEATURE_GIFTS=0 -DTELEBOT_FEATURE_CHAT_EXTRAS=0 -DTELEBOT_FEATURE_WIDGETS=0
          - name: sanitizers, no block cache
            flags: >-
              -fsanitize=address,undefined -fno-omit-frame-pointer -DTELEBOT_ARENA_CACHE_BLOCKS=0
    name: ${{ matrix.name }}

    steps:
    - uses: actions/checkout@v3
    - name: prepare
      run: sudo apt update && sudo apt install -y pkg-config libcurl4-openssl-dev cmake binutils make g++
    - name: cmake
      run: >-
        cmake -S . -B build
        -DCMAKE_C_FLAGS="${{ matrix.flags }}"
        -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
        -DCMAKE_EXE_LINKER_FLAGS="${{ contains(matrix.flags, 'sanitize') && '-fsanitize=address,undefined' || '' }}"
    - name: make
      run: cmake --build build -j
    - name: unit tests
      run: cd build && ctest --output-on-failure

  docs:
    runs-on: ubuntu-latest
    name: API docs
    steps:
    - uses: actions/checkout@v3
    - name: prepare
      run: sudo apt update && sudo apt install -y doxygen
    - name: doxygen (any warning fails the build)
      run: ( cat Doxyconf; echo "OUTPUT_DIRECTORY=/tmp/telebot-docs"; echo "WARN_AS_ERROR=FAIL_ON_WARNINGS" ) | doxygen -
